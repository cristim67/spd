worker_processes auto;
events { worker_connections 8192; }

http {
    access_log off;

    upstream apps {
        least_conn;
        server app1:8080;
        server app2:8080;
        keepalive 256;
    }
    # Câte un upstream per instanță (keep-alive), pentru acces direct prin /node/appN/.
    upstream app1 { server app1:8080; keepalive 128; }
    upstream app2 { server app2:8080; keepalive 128; }

    server {
        listen 80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Acces direct la fiecare instanță (UI: aplicare mod / statistici per instanță).
        location /node/app1/ { proxy_pass http://app1/; }
        location /node/app2/ { proxy_pass http://app2/; }

        location / { proxy_pass http://apps; }
    }
}
